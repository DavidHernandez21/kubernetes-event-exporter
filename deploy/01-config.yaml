apiVersion: v1
kind: ConfigMap
metadata:
  name: event-exporter-cfg
  namespace: monitoring
data:
  config.yaml: |
    logLevel: warn
    logFormat: json
    metricsNamePrefix: event_exporter_
    # Opt in to bounded, non-blocking receiver queues. New events are dropped when a queue is full.
    enableBoundedReceiverQueues: true
    route:
      routes:
        - match:
            - receiver: "dump"
    receivers:
      - name: "dump"
        queueCapacity: 1024
        stdout: {}
